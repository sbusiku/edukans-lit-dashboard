name: Sync KoBo activity data

on:
  schedule:
    # every 15 minutes. Adjust as needed -- GitHub's minimum practical
    # interval is ~5 min, but scheduled runs can lag under load.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual sync from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script (all five forms)
        env:
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_SERVER: https://kf.kobotoolbox.org
        run: python scripts/sync_kobo.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "kobo-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/activities.json
          git diff --cached --quiet || git commit -m "sync: update activity data [skip ci]"
          git push
