name: Sync KoBo data to Firebase

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: read              # this job no longer writes anything into the public repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull from KoBo and publish to Firebase
        env:
          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_SERVER: https://kf.kobotoolbox.org
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SYNC_EMAIL: ${{ secrets.FIREBASE_SYNC_EMAIL }}
          FIREBASE_SYNC_PASSWORD: ${{ secrets.FIREBASE_SYNC_PASSWORD }}
        run: python scripts/sync_kobo.py --firestore
